# General config
#CONFIG_ASSERT=y
#CONFIG_ASSERT_LEVEL=2
#CONFIG_ASSERT_VERBOSE=y

# Compiler library config
#CONFIG_PICOLIBC=y
#CONFIG_PICOLIBC_USE_MODULE=y
#CONFIG_REQUIRES_FULL_LIBC=y
#CONFIG_MINIMAL_LIBC=y

# system
CONFIG_KERNEL_MEM_POOL=y
CONFIG_MAIN_THREAD_PRIORITY=7
#CONFIG_PICOLIBC=y
CONFIG_ISR_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=2048
CONFIG_INIT_STACKS=y
CONFIG_NET_TX_STACK_SIZE=8192
CONFIG_NET_RX_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SHELL_STACK_SIZE=16384
CONFIG_BACNET_BASIC_SERVER_KSLEEP=100

# BACnet Library
CONFIG_BACNETSTACK=y
# BACnet Library - shell
CONFIG_BACNETSTACK_BACNET_SHELL=y
CONFIG_BACNETSTACK_BACNET_BASIC_SHELL=y
CONFIG_BACAPP_PRINT_ENABLED=y
# BACnet settings subsystem
CONFIG_BACNETSTACK_BACNET_SETTINGS=y
CONFIG_BACNET_SETTINGS_SHELL=y
# BACnet Library - options
CONFIG_BACNET_MAX_CHARACTER_STRING_BYTES=128
# BACnet Library - enable required basic objects
CONFIG_BACNET_BASIC_OBJECT_NETWORK_PORT=y
# BACnet Library - enable basic objects
CONFIG_BACNET_BASIC_OBJECTS_ACCESS=y
CONFIG_BACNET_BASIC_OBJECT_ACCUMULATOR=y
CONFIG_BACNET_BASIC_OBJECT_ANALOG_INPUT=y
CONFIG_BACNET_BASIC_OBJECT_ANALOG_OUTPUT=y
CONFIG_BACNET_BASIC_OBJECT_ANALOG_VALUE=y
CONFIG_BACNET_BASIC_OBJECT_AUDIT_LOG=y
CONFIG_BACNET_BASIC_OBJECT_FILE=y
CONFIG_BACNET_BASIC_OBJECT_BINARY_INPUT=y
CONFIG_BACNET_BASIC_OBJECT_BINARY_OUTPUT=y
CONFIG_BACNET_BASIC_OBJECT_BINARY_VALUE=y
CONFIG_BACNET_BASIC_OBJECT_CALENDAR=y
CONFIG_BACNET_BASIC_OBJECT_CHANNEL=y
CONFIG_BACNET_BASIC_OBJECT_COMMAND=y
CONFIG_BACNET_BASIC_OBJECT_COLOR=y
CONFIG_BACNET_BASIC_OBJECT_COLOR_TEMPERATURE=y
CONFIG_BACNET_BASIC_OBJECT_CHARACTERSTRING_VALUE=y
CONFIG_BACNET_BASIC_OBJECT_INTEGER_VALUE=y
CONFIG_BACNET_BASIC_OBJECT_LOAD_CONTROL=y
CONFIG_BACNET_BASIC_OBJECT_LOOP=y
CONFIG_BACNET_BASIC_OBJECT_LIGHTING_OUTPUT=y
CONFIG_BACNET_BASIC_OBJECT_BINARY_LIGHTING_OUTPUT=y
CONFIG_BACNET_BASIC_OBJECT_LIFE_SAFETY_POINT=y
CONFIG_BACNET_BASIC_OBJECT_MULTISTATE_INPUT=y
CONFIG_BACNET_BASIC_OBJECT_MULTISTATE_OUTPUT=y
CONFIG_BACNET_BASIC_OBJECT_MULTISTATE_VALUE=y
CONFIG_BACNET_BASIC_OBJECT_NOTIFICATION_CLASS=y
CONFIG_BACNET_BASIC_OBJECT_OCTET_STRING_VALUE=y
CONFIG_BACNET_BASIC_OBJECT_POSITIVE_INTEGER_VALUE=y
CONFIG_BACNET_BASIC_OBJECT_SCHEDULE=y
CONFIG_BACNET_BASIC_OBJECT_STRUCTURED_VIEW=y
CONFIG_BACNET_BASIC_OBJECT_TIME_VALUE=y
CONFIG_BACNET_BASIC_OBJECT_TIMER=y
CONFIG_BACNET_BASIC_OBJECT_TRENDLOG=y
# Access Control Objects
CONFIG_BACNET_BASIC_OBJECTS_ACCESS=y
# Property value container data types supported
CONFIG_BACAPP_ALL=y
CONFIG_BACNET_TIMER_VALUE_ALL=y
CONFIG_CHANNEL_VALUE_ALL=y

# BACnet Library - server framework - includes device and ports
CONFIG_BACNET_BASIC_SERVER=y

# BACnet Datalink Options
CONFIG_BACDL_BIP=y
CONFIG_BACDL_BIP_PORT=47808
# don't define index if you want to use the default interface
# note: with DHCP and AutoIP enabled, index 0=AutoIP, 1=DHCP
# CONFIG_BACDL_BIP_ADDRESS_INDEX=1

# networking
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_SHELL=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV4_LOG_LEVEL_DBG=n
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=2
# Dynamic IP address
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_LOG_LEVEL_DBG=n
CONFIG_NET_IPV4_AUTO=n
CONFIG_NET_IPV4_AUTO_LOG_LEVEL_DBG=n
CONFIG_NET_ICMPV4_LOG_LEVEL_DBG=n
# read the MAC address from settings and set via net_mgmt()
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_CONNECTION_MANAGER=y

# Static IP address pre-configuration
#CONFIG_NET_CONFIG_SETTINGS=y
#CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
#CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
#CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
# Network debug config
CONFIG_NET_LOG=y
CONFIG_NET_SHELL=y

#CONFIG_DNS_RESOLVER=y
#CONFIG_SLIP_STATISTICS=n

# Enable Shell, Console, and Logging features
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_MONITOR=y
#CONFIG_BOOT_BANNER=n
CONFIG_THREAD_NAME=y
CONFIG_DEVICE_SHELL=y
#CONFIG_POSIX_CLOCK=y
#CONFIG_DATE_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL_LOG_BACKEND=n
#CONFIG_LOG_STRDUP_BUF_COUNT=4
#CONFIG_LOG_STRDUP_MAX_STRING=96
#CONFIG_NET_CONN_LOG_LEVEL_DEFAULT=n
#CONFIG_NET_CONN_LOG_LEVEL_DBG=y
#CONFIG_NET_IF_LOG_LEVEL_DEFAULT=n
CONFIG_NET_IF_LOG_LEVEL_DBG=n
CONFIG_NET_LOG=y

# enable the thread, stack, and runtime stats
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_RUNTIME_STATS=y
#CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=n
#CONFIG_SCHED_THREAD_USAGE=y
#CONFIG_SCHED_THREAD_USAGE_ANALYSIS=y
CONFIG_STATS=y
CONFIG_STATS_SHELL=y

#
# Storage
#
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
#CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_RUNTIME=y
#CONFIG_SETTINGS_FILE=y
#CONFIG_SETTINGS_SHELL=y
# native_posix uses a simulated flash
#CONFIG_FLASH_SIMULATOR=y
#CONFIG_DISK_ACCESS=y.
#CONFIG_FILE_SYSTEM=y
#CONFIG_FILE_SYSTEM_LITTLEFS=y
#CONFIG_FILE_SYSTEM_SHELL=y

CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y
