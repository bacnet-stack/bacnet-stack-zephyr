sample:
  name: BACnet Lighting Device (B-LD)

common:
  platform_allow:
    - nucleo_f429zi
    - rpi_pico
    - adafruit_grand_central_m4_express
  build_only: true

tests:

  bacnet-stack.sample.profile.b-ld.bacdl_none:
    tags: bacnet

  bacnet-stack.sample.profile.b-ld.bacdl_mstp:
    extra_configs:
      - CONFIG_BACDL_MSTP=y
    tags: introduction

  bacnet-stack.sample.profile.b-ld.bacdl_bip:
    extra_configs:
      - CONFIG_BACDL_BIP=y
    tags: introduction

  bacnet-stack.sample.profile.b-ld.bacdl_bip6:
    skip: true
    extra_configs:
      - CONFIG_BACDL_BIP6=y
    tags: introduction

  bacnet-stack.sample.profile.b-ld.bacdl_ethernet:
    skip: true
    extra_configs:
      - CONFIG_BACDL_ETHERNET=y
    tags: introduction
