permissions:
  contents: read
name: Zephyr OS Samples
# For Zephyr 3.7 LTS, use the v0.26-branch
# or the latest v0.26.x release Docker image.
# Docker image was built on Ubuntu 22.04
on:
  push:
    branches: [ "default" ]
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  test:
    name: Twister Samples
    runs-on: ubuntu-22.04
    steps:
      - name: Free file system space
        run: |
          rm -rf /opt/hostedtoolcache
          docker system prune -a --volumes

      - uses: actions/checkout@v3

      - name: Run Zephyr Container
        uses: docker://ghcr.io/zephyrproject-rtos/ci:v0.26-branch
        with:
          entrypoint: /bin/sh
          args: -c ./samples.sh

